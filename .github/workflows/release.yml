# Publication d'une version : à la poussée d'une étiquette vX.Y, construit l'APK release
# signé par apk.sh et le dépose dans une release GitHub (voir docs/decisions/0019).
#
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   MAHJONG_KEYSTORE_BASE64 : la clé ~/.android/mahjong-release.jks, en base64
#                             (base64 -w0 ~/.android/mahjong-release.jks)
#   MAHJONG_KEYSTORE_PASS   : son mot de passe (contenu de ~/.android/mahjong-release.pass)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Étiquette conforme à versionName
        run: |
          VERSION="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Étiquette $GITHUB_REF_NAME, mais versionName = $VERSION dans app/build.gradle.kts"
              exit 1
          fi

      - name: Tests
        run: ./gradlew :core:test

      # Sans les secrets, apk.sh créerait une clé neuve : l'APK ne s'installerait pas
      # par-dessus les versions précédentes. On s'arrête plutôt.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.MAHJONG_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.MAHJONG_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
              echo "::error::Secrets MAHJONG_KEYSTORE_BASE64 et MAHJONG_KEYSTORE_PASS manquants"
              exit 1
          fi
          (umask 077; echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mahjong-release.jks")

      - name: APK signé
        env:
          MAHJONG_KEYSTORE: ${{ runner.temp }}/mahjong-release.jks
          MAHJONG_KEYSTORE_PASS: ${{ secrets.MAHJONG_KEYSTORE_PASS }}
        run: ./apk.sh

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mahjong-*.apk --title "$GITHUB_REF_NAME" --generate-notes

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/mahjong-release.jks"
