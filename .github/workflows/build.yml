# Tests du module :core et construction de l'APK debug, à chaque poussée sur main et à
# chaque pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests et APK debug
        run: ./gradlew :core:test :app:assembleDebug
